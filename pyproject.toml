[project]
name = "cloud-convert"
version = "0.1.0"
description = "Cloud-based 3D video conversion using Modal and iw3"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "modal>=0.63.0",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "ffmpeg-python>=0.2.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "pydantic>=2.5.0",
]

[project.scripts]
cloud-convert = "cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
